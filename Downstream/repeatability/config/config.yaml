pipeline_dir: "/rds/project/rds-fT31urweTx0/projects/project_altitude_ConvergentEvolution/Downstream/gwas_pipeline"

# Input phenotypes (pre-existing; binary versions generated by pipeline)
phenotype_dir: "/rds/project/rds-fT31urweTx0/projects/project_altitude_ConvergentEvolution/Downstream/gwas_pipeline/phenotypes"
proteomes_dir: "/home/ss3335/rds/rds-jiggins-rds-fT31urweTx0/projects/project_altitude_ConvergentEvolution/Archive/06_OrthoFinder/proteomes"

# Results subdirectories (all written by the pipeline)
gwas_results:      "/rds/project/rds-fT31urweTx0/projects/project_altitude_ConvergentEvolution/Downstream/gwas_pipeline/results/gwas"
snp_gene_results:  "/rds/project/rds-fT31urweTx0/projects/project_altitude_ConvergentEvolution/Downstream/gwas_pipeline/results/snp_gene_map"
manhattan_results: "/rds/project/rds-fT31urweTx0/projects/project_altitude_ConvergentEvolution/Downstream/gwas_pipeline/results/manhattan"
picmin_results:    "/rds/project/rds-fT31urweTx0/projects/project_altitude_ConvergentEvolution/Downstream/gwas_pipeline/results/picmin"
blast_results: "/rds/project/rds-fT31urweTx0/projects/project_altitude_ConvergentEvolution/Downstream/gwas_pipeline/results/blast_dmel"

# OrthoFinder orthogroups
orthogroups: "/rds/project/rds-fT31urweTx0/projects/project_altitude_ConvergentEvolution/Archive/06_OrthoFinder/proteomes/OrthoFinder/Results/Orthogroups/Orthogroups.tsv"

# Species list
species:
  - Hera
  - Hmel
  - Hnum
  - Hsar
  - Hana
  - Isal
  - Mlys
  - Mpol
  - Mmes
  - Mmot
  - Mmen

full_species:
  - Heliconius_erato
  - Heliconius_melpomene
  - Heliconius_numata
  - Heliconius_sara
  - Hypothyris_anastasia
  - Ithomia_salapia
  - Mechanitis_lysimnia
  - Mechanitis_polymnia
  - Mechanitis_messenoides
  - Melinaea_mothone
  - Melinaea_menophilus

# Comma-separated string for passing to shell scripts
species_str: "Hera,Hmel,Hnum,Hsar,Hana,Isal,Mlys,Mpol,Mmes,Mmot,Mmen"

# Hardcoded altitude thresholds
altitude_low_max: 200
altitude_high_min: 1000

# OrthoFinder species name mapping
# Maps pipeline species codes → column headers in Orthogroups.tsv
# Run: head -1 Orthogroups.tsv  to confirm exact column names
orthofinder_names:
  Hera: "Heliconius_erato"
  Hmel: "Heliconius_melpomene"
  Hnum: "Heliconius_numata"
  Hsar: "Heliconius_sara"
  Hana: "Hypothyris_anastasia"
  Isal: "Ithomia_salapia"
  Mlys: "Mechanitis_lysimnia"
  Mpol: "Mechanitis_polymnia"
  Mmes: "Mechanitis_messenoides"
  Mmot: "Melinaea_mothone"
  Mmen: "Melinaea_menophilus"

# Colon-separated key:value string for passing to shell/R scripts
orthofinder_names_str: "Hera:Heliconius_erato,Hmel:Heliconius_melpomene,Hnum:Heliconius_numata,Hsar:Heliconius_sara,Hana:Hypothyris_anastasia,Isal:Ithomia_salapia,Mlys:Mechanitis_lysimnia,Mpol:Mechanitis_polymnia,Mmes:Mechanitis_messenoides,Mmot:Melinaea_mothone,Mmen:Melinaea_menophilus"

# Binary phenotype thresholds
# Thresholds are computed per-species from the phenotype file itself:
#   low  = bottom 25% of altitude values → 1
#   high = top 25% of altitude values    → 2 
#   middle 50%                           → excluded (-9)
# No hard-coded values needed here.

# SLURM / resource settings
threads: 8
slurm_partition: "icelake"
slurm_account: "JIGGINS-SL2-CPU"
slurm_extra: "--mail-type=FAIL --mail-user=ss3335@cam.ac.uk"

# VCF pre-processing
min_depth: 5      # remove individuals with mean depth of coverage < this
max_missing: 0.25 # remove sites with > this proportion of missing genotypes
min_maf: 0.01     # remove sites with MAF < this (removes singletons and likely
                  # artefacts while retaining rare variants with statistical power)

# BEAGLE imputation params
impute_min_snps: 2
impute_memory_gb: 108
impute_threads: 32

# GEMMA GWAS parameters
missingness: 0.25  # within-GEMMA missingness filter (applied after VCF QC)
n_pcs: 5

# Per-species scaffold patterns (for Manhattan plot chromosome ordering)
# Scaffolds whose names match the pattern are ordered by descending length.
# For ENA species all scaffolds are chromosomal so we match "ENA" to capture all.
chrom_patterns:
  Hera: "Herato"
  Hmel: "Hmr"
  Hnum: "Hnum"
  Hsar: "SUPER_"
  Hana: "scaffold_"
  Isal: "SUPER_"
  Mlys: "ENA"
  Mpol: "ENA"
  Mmes: "ENA"
  Mmot: "ENA"
  Mmen: "ENA"

# Per-species GFF gene ID extraction
# Options:
#   "ID_direct"   : use ID= value as-is          (Hera, Hsar)
#   "ID_last_num" : use numeric suffix after last _ (Helixer species: Hana, Isal,
#                   Hmel, Mlys, Mpol, Mmes, Mmot, Mmen — matches clean_gene_id())
#   "ID_strip_prefix": strip "file_1_file_1_" prefix then use remainder (Hnum)
gene_id_strategy:
  Hera: "ID_direct"
  Hmel: "ID_last_num"
  Hnum: "ID_strip_prefix"
  Hsar: "ID_direct"
  Hana: "ID_last_num"
  Isal: "ID_last_num"
  Mlys: "ID_last_num"
  Mpol: "ID_last_num"
  Mmes: "ID_last_num"
  Mmot: "ID_last_num"
  Mmen: "ID_last_num"

# Comma-separated strings of the above for passing to shell/R scripts
chrom_patterns_str: "Hera:Herato,Hmel:Hmr,Hnum:Hnum,Hsar:SUPER_,Hana:scaffold_,Isal:SUPER_,Mlys:ENA,Mpol:ENA,Mmes:ENA,Mmot:ENA,Mmen:ENA"
gene_id_strategy_str: "Hera:ID_direct,Hmel:ID_last_num,Hnum:ID_strip_prefix,Hsar:ID_direct,Hana:ID_last_num,Isal:ID_last_num,Mlys:ID_last_num,Mpol:ID_last_num,Mmes:ID_last_num,Mmot:ID_last_num,Mmen:ID_last_num"

# PicMin parameters
picmin_alpha_adapt: 0.05
picmin_num_reps: 1000000
picmin_null_reps: 10000
picmin_fdr_threshold: 0.01